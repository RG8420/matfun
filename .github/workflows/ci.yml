name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gcc-version: ['9', '10', '11', '12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up GCC
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install GCC
      run: sudo apt-get update && sudo apt-get install -y gcc-${{ matrix.gcc-version }}

    - name: Build
      run: |
        make CC=gcc-${{ matrix.gcc-version }}

    - name: Test
      run: |
        echo "A = [[1,2],[3,4]]" | ./matfun
        echo "det A" | ./matfun